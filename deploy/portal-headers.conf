# Security headers for the portal.
#
# The app sets the main ones itself too, so a deployment that forgets to
# include this file is still covered. They are repeated here because
# nginx add_header does not merge: ANY add_header in a block discards
# every header inherited from an outer one. That is the trap -- a
# partial list here silently removes the rest of your global set. If
# your http{} block adds headers this file does not list, add them.
#
# `always` makes them apply to error responses too, not only 2xx.
#
# The app sets several of these itself (so a deployment with no proxy is
# still covered). Without the proxy_hide_header lines every one of them
# would reach the browser twice. Most browsers tolerate two identical
# values; X-Frame-Options is the exception -- a doubled header can be
# read as invalid and ignored, which silently removes clickjacking
# protection. So nginx drops the upstream copy and sends only its own.

proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Robots-Tag;
proxy_hide_header X-Download-Options;
proxy_hide_header X-Permitted-Cross-Domain-Policies;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;
# SAMEORIGIN rather than DENY: the dashboard shell frames the dashboard
# app from this same origin.
add_header X-Frame-Options           "SAMEORIGIN" always;
# Generated graph pages are not content anyone should find in a search
# engine; the site this replaced set this globally and losing it would
# have made every graph indexable.
add_header X-Robots-Tag              "none" always;
add_header X-Download-Options        "noopen" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
