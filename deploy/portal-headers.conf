# Security headers for the portal.
#
# The app sets these itself too, so a deployment that forgets to include
# this file is still covered. They are repeated here because nginx
# add_header does not merge: any add_header in a block discards every
# header inherited from an outer one, so each location that adds
# anything must restate the full set.
#
# `always` makes them apply to error responses as well, not only 2xx.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;
# SAMEORIGIN rather than DENY: the dashboard shell frames the dashboard
# app from this same origin.
add_header X-Frame-Options           "SAMEORIGIN" always;
