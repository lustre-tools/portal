# Rate-limit zone for the portal's login endpoint.
#
# limit_req_zone is only valid in http{}, so this cannot live in the
# site file. install.sh puts it wherever the distribution includes
# http-level snippets from.
#
# 10 MB tracks on the order of 160k addresses. binary_remote_addr is the
# packed client IP, which is why the zone is so small per entry.

limit_req_zone $binary_remote_addr zone=portal_login:10m rate=10r/m;
