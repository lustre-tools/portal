name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The gc CLI lives in a submodule. Not recursive: it has a
          # nested one over SSH that no CI runner can fetch.
          submodules: false

      - name: Fetch the tools submodule
        run: git submodule update --init vendor/llm_tools

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e vendor/llm_tools/llm_tool_common
          pip install -e vendor/llm_tools/gerrit_cli
          pip install -e vendor/llm_tools/gerrit_dashboard
          pip install -e '.[dev]'

      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n install.sh
          shellcheck install.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scanning history needs all of it.
          fetch-depth: 0

      # The official gitleaks action requires a paid licence for
      # organisation repositories. The binary does not, and it is the
      # same scanner.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact --exit-code 1

      - name: Scan the history
        run: gitleaks git . --no-banner --redact --exit-code 1

      - name: Refuse to ship secret files
        run: |
          # Belt and braces: these must never be tracked, whatever
          # .gitignore currently says.
          if git ls-files --error-unmatch .env users.json 2>/dev/null; then
            echo "::error::a secret file is tracked in git"
            exit 1
          fi
          echo "no secret files tracked"
